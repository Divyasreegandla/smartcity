<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 500px; margin: 0 auto; padding: 20px;">
    <div style="background: #1a56db; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
        <h1 style="margin: 0;">🏙️ Smart City</h1>
        <p style="margin: 5px 0 0;">OTP Verification</p>
    </div>
    
    <div style="background: #f8fafc; padding: 20px; border: 1px solid #e2e8f0; border-radius: 0 0 8px 8px;">
        <p>Hello,</p>
        
        <p>Please use the following OTP to complete your <strong>{{ purpose }}</strong>:</p>
        
        <div style="text-align: center; padding: 20px; margin: 20px 0; background: #ffffff; border: 2px dashed #1a56db; border-radius: 8px;">
            <span style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #1a56db;">{{ otp }}</span>
        </div>
        
        <p>This OTP is valid for <strong>{{ expiry_minutes }} minutes</strong>.</p>
        
        <p style="color: #64748b; font-size: 14px;">If you did not request this OTP, please ignore this email.</p>
        
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        
        <p style="font-size: 12px; color: #94a3b8; text-align: center;">
            This is a system-generated email. Please do not reply to this email.
        </p>
    </div>
</body>
</html>
